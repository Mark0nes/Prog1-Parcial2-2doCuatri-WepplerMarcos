<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talleres de Extensión</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
    <h1>Talleres de Extensión</h1>
    <p>consulta de cupos</p>
  </header>

  <main>
    <div id="mensaje-error" class="mensaje-error" hidden></div>

    <section id="talleres">
      <h2>Talleres disponibles</h2>
      <p id="estado-carga">Cargando talleres...</p>
      <table>
        <thead>
          <tr>
            <th>Taller</th>
            <th>Día</th>
            <th>Horario</th>
            <th>Cupos disponibles</th>
          </tr>
        </thead>
        <tbody id="tabla-talleres">
        </tbody>
      </table>
    </section>
  </main>
  
  <script src="app.js"></script>
</body>
</html>
